version: '3.8'

services:
  ncat:
    image: stephengpope/no-code-architects-toolkit:latest
    container_name: ianews-ncat
    restart: unless-stopped
    ports:
      - "8001:5000"
    volumes:
      - ncat_storage:/var/www/html/storage/app
      - ncat_logs:/var/www/html/storage/logs
    environment:
      - API_KEY=ianews-nca-free-key-2025
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/v1/toolkit/authenticate"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ncat_storage:
    driver: local
  ncat_logs:
    driver: local
